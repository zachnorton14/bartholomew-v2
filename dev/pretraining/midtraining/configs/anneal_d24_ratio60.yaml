# =============================================================================
# Anneal-ablation config -- 60% midtrain mixture off the d24 base run.
#
# Resumes sclean1930s-d24-r12-ctx4096-sssl-fulltok-v1 @ step 5500 and runs 250
# more steps on the 60% midtrain mix, with linear LR decay to 0 (the default).
# Only the final checkpoint is saved. Params that must match the parent
# (architecture, tokenizer, vocab, batch sizes, weight decay) are auto-derived
# from the seed checkpoint -- see configs/anneal_ablation_sample.yaml for the
# full schema.
# =============================================================================

# --- Identity -----------------------------------------------------------------
tag: clean1930s-d24-r12-ctx4096-sssl-fulltok-v1-anneal-ratio60-v1

# --- Parent (what we resume from) --------------------------------------------
parent:
  tag: clean1930s-d24-r12-ctx4096-sssl-fulltok-v1   # base-train experiment tag on HF
  step: 5500                                         # exact checkpoint step to resume from

# --- Ablation horizon ---------------------------------------------------------
# Absolute horizon handed to the trainer = parent.step + num_steps = 5750.
num_steps: 250

# --- Midtrain mixture ---------------------------------------------------------
# 60% midtrain / 40% old-corpus -> DATASET_HF_REPO/mixed/ratio_60/data
ratio_pct: 60

# --- Checkpointing ------------------------------------------------------------
# Final checkpoint only (no intermediate checkpoints for this ablation).
checkpoint_every: -1

# --- Learning rate ------------------------------------------------------------
# Default (no block): each parent per-group LR decays LINEARLY to 0 across the
# 250 anneal steps. No override needed.
